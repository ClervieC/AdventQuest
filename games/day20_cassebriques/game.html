<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; touch-action: none; }
    #game-container { width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    // ============================================
    // PONT DE COMMUNICATION — ne pas modifier
    // ============================================
    function sendToReactNative(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      } else {
        console.log('[DEV MODE]', message);
      }
    }
    function endGame(success, score) {
      sendToReactNative({ type: 'GAME_OVER', success, score });
    }
    function notifyReady() {
      sendToReactNative({ type: 'GAME_READY' });
    }
    function notifyHintUsed() {
      sendToReactNative({ type: 'REQUEST_HINT_USE' });
    }

    let currentDifficulty = 'easy';
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'INIT') {
          currentDifficulty = data.difficulty;
          hintsLeft = typeof data.hintsAvailable === 'number' ? data.hintsAvailable : 0;
          configureDifficulty(currentDifficulty);
        }
      } catch (e) {}
    });

    // ============================================
    // CONFIG SPÉCIFIQUE CASSE-BRIQUES ENCHANTÉ
    // ============================================

    const DIFFICULTY_SETTINGS = {
      easy:      { rows: 4, cols: 7, ballSpeed: 400, durationMs: 90000,  strongChance: 0,    powerChance: 0.2,  malusChance: 0.25 },
      medium:    { rows: 5, cols: 7, ballSpeed: 430, durationMs: 90000,  strongChance: 0.15, powerChance: 0.2,  malusChance: 0.3 },
      hard:      { rows: 6, cols: 8, ballSpeed: 460, durationMs: 100000, strongChance: 0.25, powerChance: 0.18, malusChance: 0.35 },
      very_hard: { rows: 7, cols: 8, ballSpeed: 500, durationMs: 110000, strongChance: 0.35, powerChance: 0.16, malusChance: 0.4 },
    };

    let settings = DIFFICULTY_SETTINGS.easy;

    function configureDifficulty(difficulty) {
      settings = DIFFICULTY_SETTINGS[difficulty] || DIFFICULTY_SETTINGS.easy;
      startGame();
    }

    const BALL_RADIUS = 7;
    const PADDLE_BASE_W = 86;
    const PADDLE_H = 14;
    const BRICK_H = 20;
    const BRICK_GAP = 4;
    const BRICKS_OFFSET_Y = 50; // espace au-dessus du mur : la balle peut s'y faufiler
    const BRICK_POINTS = 10;
    const TIME_BONUS_PER_SECOND = 5;
    const MAX_BOUNCE_ANGLE = Phaser.Math.DegToRad(60);
    const MAX_BALLS = 6;
    const EFFECT_MS = 8000;
    const FAST_FACTOR = 1.35;
    const WIDE_FACTOR = 1.5;
    const CAPSULE_SPEED = 170;
    const AUTO_LAUNCH_MS = 2000;

    // Bonus (✨) et malus (💀) contenus dans certains blocs de glace
    const POWERS = {
      multi:  { emoji: '🔮', label: 'Balle double !',       good: true },
      wide:   { emoji: '↔️', label: 'Raquette large !',     good: true },
      time:   { emoji: '⏳', label: '+10 s',                good: true },
      invert: { emoji: '🌀', label: 'Commandes inversées !', good: false },
      fast:   { emoji: '⚡', label: 'Balle rapide !',        good: false },
    };
    const GOOD_POWERS = ['multi', 'wide', 'time'];
    const BAD_POWERS = ['invert', 'fast'];

    let scene;
    let width, height, topY, paddleY, brickW, marginX;

    let paddle, paddleSprite, netSprite;
    let balls = [];
    let bricks = [];
    let capsules = [];

    let running = false;
    let gameEnded = false;
    let score = 0;
    let combo = 0;
    let elapsedMs = 0;
    let bonusTimeMs = 0;
    let launchAt = 0;
    let wideUntil = 0;
    let invertUntil = 0;
    let fastUntil = 0;
    let netActive = false;
    let hintsLeft = 0;
    let keys;

    let scoreText, timeText, comboText, effectText, hintButton, hintText, messageText;
    let bgObjects = [];

    function preload() {}

    function create() {
      scene = this;

      paddleSprite = this.add.rectangle(0, 0, PADDLE_BASE_W, PADDLE_H, 0xa78bfa).setStrokeStyle(2, 0xede9fe).setDepth(5);
      netSprite = this.add.rectangle(0, 0, 10, 4, 0x7dd3fc, 0.8).setOrigin(0, 0.5).setDepth(4).setVisible(false);

      scoreText = this.add.text(20, 20, 'Score: 0', { fontSize: '20px', color: '#ffffff', fontStyle: 'bold' }).setDepth(10);
      comboText = this.add.text(20, 46, '', { fontSize: '15px', color: '#fbbf24', fontStyle: 'bold' }).setDepth(10);
      timeText = this.add.text(0, 20, '', { fontSize: '20px', color: '#f59e0b', fontStyle: 'bold' }).setOrigin(1, 0).setDepth(10);
      hintButton = this.add.rectangle(0, 46, 120, 32, 0x1e0d40).setOrigin(1, 0).setStrokeStyle(1, 0x7c3aed).setDepth(10);
      hintText = this.add.text(0, 62, '', { fontSize: '13px', color: '#c4b5fd', fontStyle: 'bold' }).setOrigin(0.5).setDepth(11);
      effectText = this.add.text(0, 0, '', { fontSize: '13px', color: '#c4b5fd', align: 'center' }).setOrigin(0.5).setDepth(10);
      messageText = this.add.text(0, 0, 'Glisse le doigt pour bouger la raquette\nTape pour lancer la balle', {
        fontSize: '14px', color: '#7a9ab8', align: 'center',
      }).setOrigin(0.5).setDepth(10);

      layout();
      // La WebView change de taille entre l'écran d'intro et la partie : on recalcule tout
      this.scale.on('resize', layout);

      this.input.on('pointerdown', handlePointerDown);
      this.input.on('pointermove', (pointer) => { if (pointer.isDown || !pointer.wasTouch) movePaddleTo(pointer.x); });
      this.input.on('pointerup', () => launchBalls());

      // Clavier pour tester game.html dans un navigateur
      keys = this.input.keyboard.createCursorKeys();
      this.input.keyboard.on('keydown-SPACE', launchBalls);

      resetState();
      notifyReady();

      // Hors de l'app (navigateur), on lance directement une partie
      if (!window.ReactNativeWebView) {
        hintsLeft = 3;
        scene.time.delayedCall(300, () => configureDifficulty('easy'));
      }
    }

    function layout() {
      width = scene.scale.width;
      height = scene.scale.height;
      topY = 100;
      paddleY = height - 80;
      marginX = 14;
      brickW = (width - marginX * 2 - BRICK_GAP * (settings.cols - 1)) / settings.cols;

      drawBackground();

      timeText.setX(width - 20);
      hintButton.setX(width - 20);
      hintText.setX(width - 80);
      effectText.setPosition(width / 2, paddleY + 42);
      messageText.setPosition(width / 2, height * 0.58);
      netSprite.setPosition(0, paddleY + 30).setSize(width, 4);

      // Les blocs sont repérés par ligne/colonne : on recalcule leur position
      bricks.filter((b) => b.alive).forEach(placeBrick);
      if (paddle) {
        paddle.x = Phaser.Math.Clamp(paddle.x, paddleWidth() / 2, width - paddleWidth() / 2);
        syncPaddle();
      }
    }

    function drawBackground() {
      bgObjects.forEach((o) => o.destroy());
      bgObjects = [];
      const add = (obj) => { bgObjects.push(obj); return obj; };
      for (let i = 0; i < 40; i++) {
        add(scene.add.circle(Math.random() * width, topY + Math.random() * (height - topY), Math.random() * 1.5 + 0.5, 0xffffff, Math.random() * 0.35 + 0.1));
      }
      add(scene.add.rectangle(0, topY - 12, width, 2, 0x3b2a6b).setOrigin(0, 0));
    }

    // ---------- Construction ----------

    function buildBricks() {
      bricks.forEach((b) => b.sprite.destroy());
      bricks = [];
      for (let row = 0; row < settings.rows; row++) {
        for (let col = 0; col < settings.cols; col++) {
          const strong = Math.random() < settings.strongChance;
          let power = null;
          if (Math.random() < settings.powerChance) {
            const pool = Math.random() < settings.malusChance ? BAD_POWERS : GOOD_POWERS;
            power = pool[Math.floor(Math.random() * pool.length)];
          }
          const rect = scene.add.rectangle(0, 0, 10, BRICK_H, 0x000000).setDepth(2);
          const mark = scene.add.text(0, 0, power ? '✨' : '', { fontSize: '12px' }).setOrigin(0.5).setDepth(3);
          const sprite = scene.add.container(0, 0, [rect, mark]);
          const brick = { row, col, hp: strong ? 2 : 1, power, rect, sprite, alive: true };
          paintBrick(brick);
          placeBrick(brick);
          bricks.push(brick);
        }
      }
    }

    function paintBrick(brick) {
      // Couleur par ligne, plus sombre pour la glace épaisse (2 coups)
      const palette = [0xbae6fd, 0x93c5fd, 0xa5b4fc, 0xc4b5fd, 0x7dd3fc, 0x818cf8, 0xe0e7ff];
      const base = palette[brick.row % palette.length];
      brick.rect.setFillStyle(brick.hp >= 2 ? 0x3b5b8a : base, brick.hp >= 2 ? 1 : 0.9);
      brick.rect.setStrokeStyle(brick.hp >= 2 ? 2 : 1, brick.hp >= 2 ? 0xbae6fd : 0xffffff, brick.hp >= 2 ? 0.9 : 0.35);
    }

    function placeBrick(brick) {
      brick.x = marginX + brick.col * (brickW + BRICK_GAP) + brickW / 2;
      brick.y = topY + BRICKS_OFFSET_Y + brick.row * (BRICK_H + BRICK_GAP) + BRICK_H / 2;
      brick.w = brickW;
      brick.h = BRICK_H;
      brick.rect.setSize(brickW, BRICK_H);
      brick.rect.setDisplayOrigin(brickW / 2, BRICK_H / 2);
      brick.sprite.setPosition(brick.x, brick.y);
    }

    function createBall(x, y, vx, vy, attached) {
      const sprite = scene.add.circle(x, y, BALL_RADIUS, 0xffffff).setStrokeStyle(2, 0x7dd3fc).setDepth(6);
      const ball = { x, y, vx, vy, attached, sprite };
      balls.push(ball);
      return ball;
    }

    function resetState() {
      balls.forEach((b) => b.sprite.destroy());
      capsules.forEach((c) => c.sprite.destroy());
      balls = [];
      capsules = [];
      score = 0;
      combo = 0;
      elapsedMs = 0;
      bonusTimeMs = 0;
      wideUntil = 0;
      invertUntil = 0;
      fastUntil = 0;
      netActive = false;
      running = false;
      gameEnded = false;

      layout(); // le nombre de colonnes dépend de la difficulté
      buildBricks();

      paddle = { x: width / 2 };
      syncPaddle();
      createBall(paddle.x, paddleY - PADDLE_H / 2 - BALL_RADIUS, 0, 0, true);
      netSprite.setVisible(false);

      scoreText.setText('Score: 0');
      comboText.setText('');
      effectText.setText('');
      timeText.setText(Math.ceil(settings.durationMs / 1000) + 's');
      updateHintButton();
    }

    // INIT peut être reçu à chaque "Rejouer" : on repart toujours d'une partie propre
    function startGame() {
      resetState();
      running = true;
      launchAt = scene.time.now + AUTO_LAUNCH_MS;
      messageText.setAlpha(1);
      scene.tweens.add({ targets: messageText, alpha: 0, delay: 2200, duration: 600 });
    }

    // ---------- Aides ----------

    function progress() {
      return Math.min(1, elapsedMs / settings.durationMs);
    }

    function paddleWidth() {
      return PADDLE_BASE_W * (scene.time.now < wideUntil ? WIDE_FACTOR : 1);
    }

    function ballSpeed() {
      // Accélère doucement au fil de la partie
      return settings.ballSpeed * (1 + 0.2 * progress()) * (scene.time.now < fastUntil ? FAST_FACTOR : 1);
    }

    function syncPaddle() {
      paddleSprite.setPosition(paddle.x, paddleY).setSize(paddleWidth(), PADDLE_H);
      paddleSprite.setDisplayOrigin(paddleWidth() / 2, PADDLE_H / 2);
      paddleSprite.setFillStyle(scene.time.now < invertUntil ? 0xf87171 : 0xa78bfa);
    }

    function updateHintButton() {
      hintText.setText(netActive ? '🕸️ Filet actif' : '💡 Filet (' + hintsLeft + ')');
      hintButton.setAlpha(hintsLeft > 0 || netActive ? 1 : 0.4);
    }

    function updateEffectText() {
      const now = scene.time.now;
      const parts = [];
      if (now < wideUntil) parts.push('↔️ ' + Math.ceil((wideUntil - now) / 1000) + 's');
      if (now < invertUntil) parts.push('🌀 ' + Math.ceil((invertUntil - now) / 1000) + 's');
      if (now < fastUntil) parts.push('⚡ ' + Math.ceil((fastUntil - now) / 1000) + 's');
      effectText.setText(parts.join('   '));
    }

    // ---------- Entrées ----------

    function handlePointerDown(pointer) {
      if (!running) return;
      // Le hint ne se déclenche qu'au tap sur le bouton
      if (hintButton.getBounds().contains(pointer.x, pointer.y)) {
        useHint();
        return;
      }
      movePaddleTo(pointer.x);
    }

    function movePaddleTo(x) {
      if (!running) return;
      // Malus "commandes inversées" : la raquette part du côté opposé au doigt
      const targetX = scene.time.now < invertUntil ? width - x : x;
      const half = paddleWidth() / 2;
      paddle.x = Phaser.Math.Clamp(targetX, half, width - half);
    }

    function launchBalls() {
      if (!running) return;
      balls.forEach((b) => {
        if (!b.attached) return;
        b.attached = false;
        const angle = Phaser.Math.FloatBetween(-0.35, 0.35);
        b.vx = Math.sin(angle) * ballSpeed();
        b.vy = -Math.cos(angle) * ballSpeed();
      });
    }

    function useHint() {
      if (hintsLeft <= 0 || netActive) return;
      hintsLeft -= 1;
      netActive = true;
      netSprite.setVisible(true).setAlpha(0);
      scene.tweens.add({ targets: netSprite, alpha: 0.8, duration: 250 });
      notifyHintUsed();
      flashFeedback(width / 2, paddleY - 60, '🕸️ Filet de secours !', '#7dd3fc');
      updateHintButton();
    }

    // ---------- Boucle ----------

    function update(time, delta) {
      if (!running) return;

      const dtMs = Math.min(delta, 50); // évite les sauts énormes si la WebView a été en pause
      elapsedMs += dtMs;

      if (keys.left.isDown) movePaddleTo((scene.time.now < invertUntil ? width - paddle.x : paddle.x) - 600 * dtMs / 1000);
      if (keys.right.isDown) movePaddleTo((scene.time.now < invertUntil ? width - paddle.x : paddle.x) + 600 * dtMs / 1000);
      // Si la raquette s'élargit/rétrécit, on la garde dans l'écran
      paddle.x = Phaser.Math.Clamp(paddle.x, paddleWidth() / 2, width - paddleWidth() / 2);
      syncPaddle();

      if (time >= launchAt) launchBalls();

      // Sous-pas pour que la balle ne traverse pas les blocs à grande vitesse
      const steps = 4;
      const dt = dtMs / 1000 / steps;
      for (let i = 0; i < steps && running; i++) stepBalls(dt);
      if (!running) return;

      updateCapsules(dtMs / 1000);
      updateEffectText();

      const msLeft = settings.durationMs + bonusTimeMs - elapsedMs;
      timeText.setText(Math.max(0, Math.ceil(msLeft / 1000)) + 's');
      if (msLeft <= 0) finishGame(false);
    }

    function stepBalls(dt) {
      const speed = ballSpeed();
      for (const ball of balls) {
        if (ball.attached) {
          ball.x = paddle.x;
          ball.y = paddleY - PADDLE_H / 2 - BALL_RADIUS;
          ball.sprite.setPosition(ball.x, ball.y);
          continue;
        }

        normalizeVelocity(ball, speed);
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Murs
        if (ball.x < BALL_RADIUS) { ball.x = BALL_RADIUS; ball.vx = Math.abs(ball.vx); }
        if (ball.x > width - BALL_RADIUS) { ball.x = width - BALL_RADIUS; ball.vx = -Math.abs(ball.vx); }
        if (ball.y < topY - 12 + BALL_RADIUS) { ball.y = topY - 12 + BALL_RADIUS; ball.vy = Math.abs(ball.vy); }

        // Raquette : l'angle de rebond dépend de l'endroit touché
        const half = paddleWidth() / 2;
        if (ball.vy > 0
          && ball.y + BALL_RADIUS >= paddleY - PADDLE_H / 2
          && ball.y - BALL_RADIUS <= paddleY + PADDLE_H / 2
          && ball.x >= paddle.x - half - BALL_RADIUS
          && ball.x <= paddle.x + half + BALL_RADIUS) {
          const hit = Phaser.Math.Clamp((ball.x - paddle.x) / half, -1, 1);
          const angle = hit * MAX_BOUNCE_ANGLE;
          ball.vx = Math.sin(angle) * speed;
          ball.vy = -Math.cos(angle) * speed;
          ball.y = paddleY - PADDLE_H / 2 - BALL_RADIUS;
          combo = 0;
          comboText.setText('');
        }

        // Filet de secours (hint)
        if (netActive && ball.vy > 0 && ball.y + BALL_RADIUS >= paddleY + 30) {
          ball.y = paddleY + 30 - BALL_RADIUS;
          ball.vy = -Math.abs(ball.vy);
          netActive = false;
          scene.tweens.add({ targets: netSprite, alpha: 0, duration: 300, onComplete: () => netSprite.setVisible(false) });
          flashFeedback(ball.x, paddleY, 'Sauvé !', '#7dd3fc');
          updateHintButton();
        }

        collideBricks(ball);
        ball.sprite.setPosition(ball.x, ball.y);
      }

      // Balles perdues
      balls = balls.filter((b) => {
        if (b.y - BALL_RADIUS > height) { b.sprite.destroy(); return false; }
        return true;
      });
      if (balls.length === 0) finishGame(false);
    }

    // Garde une vitesse constante et évite les trajectoires presque horizontales (balle "coincée")
    function normalizeVelocity(ball, speed) {
      const len = Math.hypot(ball.vx, ball.vy) || 1;
      ball.vx = (ball.vx / len) * speed;
      ball.vy = (ball.vy / len) * speed;
      const minVy = speed * 0.3;
      if (Math.abs(ball.vy) < minVy) {
        ball.vy = Math.sign(ball.vy || -1) * minVy;
        ball.vx = Math.sign(ball.vx || 1) * Math.sqrt(speed * speed - minVy * minVy);
      }
    }

    function collideBricks(ball) {
      for (const brick of bricks) {
        if (!brick.alive) continue;
        const left = brick.x - brick.w / 2;
        const right = brick.x + brick.w / 2;
        const top = brick.y - brick.h / 2;
        const bottom = brick.y + brick.h / 2;
        const cx = Phaser.Math.Clamp(ball.x, left, right);
        const cy = Phaser.Math.Clamp(ball.y, top, bottom);
        const dx = ball.x - cx;
        const dy = ball.y - cy;
        if (dx * dx + dy * dy > BALL_RADIUS * BALL_RADIUS) continue;

        // Rebond sur l'axe de plus faible pénétration
        const penX = Math.min(Math.abs(ball.x + BALL_RADIUS - left), Math.abs(right - (ball.x - BALL_RADIUS)));
        const penY = Math.min(Math.abs(ball.y + BALL_RADIUS - top), Math.abs(bottom - (ball.y - BALL_RADIUS)));
        if (penX < penY) {
          ball.vx = ball.x < brick.x ? -Math.abs(ball.vx) : Math.abs(ball.vx);
        } else {
          ball.vy = ball.y < brick.y ? -Math.abs(ball.vy) : Math.abs(ball.vy);
        }
        hitBrick(brick);
        return; // un seul bloc par sous-pas
      }
    }

    function hitBrick(brick) {
      brick.hp -= 1;
      if (brick.hp > 0) {
        paintBrick(brick);
        scene.tweens.add({ targets: brick.sprite, scale: 0.9, duration: 60, yoyo: true });
        return;
      }

      brick.alive = false;
      combo += 1;
      const points = BRICK_POINTS * combo;
      score += points;
      scoreText.setText('Score: ' + score);
      if (combo >= 2) comboText.setText('Combo ×' + combo);
      flashFeedback(brick.x, brick.y, '+' + points, '#fbbf24');
      scene.tweens.add({ targets: brick.sprite, alpha: 0, scale: 1.3, duration: 150, onComplete: () => brick.sprite.destroy() });

      if (brick.power) spawnCapsule(brick.x, brick.y, brick.power);

      if (bricks.every((b) => !b.alive)) winGame();
    }

    function spawnCapsule(x, y, power) {
      const sprite = scene.add.text(x, y, POWERS[power].emoji, { fontSize: '24px' }).setOrigin(0.5).setDepth(4);
      capsules.push({ x, y, power, sprite });
    }

    function updateCapsules(dt) {
      const half = paddleWidth() / 2;
      capsules = capsules.filter((c) => {
        c.y += CAPSULE_SPEED * dt;
        c.sprite.setPosition(c.x, c.y);
        const caught = c.y + 12 >= paddleY - PADDLE_H / 2 && c.y - 12 <= paddleY + PADDLE_H / 2
          && c.x >= paddle.x - half - 10 && c.x <= paddle.x + half + 10;
        if (caught) {
          applyPower(c.power);
          c.sprite.destroy();
          return false;
        }
        if (c.y > height + 30) { c.sprite.destroy(); return false; }
        return true;
      });
    }

    function applyPower(power) {
      const now = scene.time.now;
      const info = POWERS[power];
      flashFeedback(paddle.x, paddleY - 40, info.label, info.good ? '#34d399' : '#f87171');

      if (power === 'multi') {
        const current = balls.filter((b) => !b.attached);
        for (const b of current) {
          if (balls.length >= MAX_BALLS) break;
          createBall(b.x, b.y, -b.vx, b.vy, false);
        }
        if (current.length === 0) launchBalls();
      } else if (power === 'wide') {
        wideUntil = now + EFFECT_MS;
      } else if (power === 'time') {
        bonusTimeMs += 10000;
      } else if (power === 'invert') {
        invertUntil = now + EFFECT_MS * 0.75;
      } else if (power === 'fast') {
        fastUntil = now + EFFECT_MS * 0.75;
      }
    }

    function flashFeedback(x, y, text, color) {
      const feedback = scene.add.text(x, y, text, { fontSize: '16px', color, fontStyle: 'bold' }).setOrigin(0.5).setDepth(12);
      scene.tweens.add({
        targets: feedback,
        y: y - 36,
        alpha: 0,
        duration: 700,
        onComplete: () => feedback.destroy(),
      });
    }

    function winGame() {
      // Bonus pour le temps restant
      const secondsLeft = Math.max(0, Math.ceil((settings.durationMs + bonusTimeMs - elapsedMs) / 1000));
      score += secondsLeft * TIME_BONUS_PER_SECOND;
      scoreText.setText('Score: ' + score);
      flashFeedback(width / 2, height / 2, 'Glace brisée ! +' + secondsLeft * TIME_BONUS_PER_SECOND, '#34d399');
      finishGame(true);
    }

    function finishGame(success) {
      if (gameEnded) return;
      gameEnded = true;
      running = false;
      if (!success) scene.cameras.main.shake(200, 0.01);
      scene.time.delayedCall(success ? 700 : 500, () => endGame(success, score));
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: 'rgba(0,0,0,0)',
      transparent: true,
