<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #game-container { width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    // ============================================
    // PONT DE COMMUNICATION — ne pas modifier
    // ============================================
    function sendToReactNative(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      } else {
        console.log('[DEV MODE]', message);
      }
    }
    // Bruitage (moteur injecté par l'app, silencieux si le son est coupé)
    function sfx(name) {
      if (window.GameSounds) window.GameSounds.play(name);
    }
    // Texte dans la langue du joueur (injectée par l'app ; français si le HTML est ouvert seul)
    function T(fr, en) {
      return window.GAME_LANG === 'en' ? en : fr;
    }
    // bonus : part du score gagnée en temps additionnel (non plafonnée par l'app ; le reste l'est à 2 000)
    function endGame(success, score, bonus) {
      sendToReactNative({ type: 'GAME_OVER', success, score, bonus: bonus || 0 });
    }
    function notifyReady() {
      sendToReactNative({ type: 'GAME_READY' });
    }

    let currentDifficulty = 'easy';
    let arcadeMode = false; // onglet Jeux : partie sans fin (ou par niveaux), sans objectif du jour
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'INIT') {
          arcadeMode = data.arcade === true;
          currentDifficulty = data.difficulty;
          configureDifficulty(currentDifficulty);
        }
      } catch (e) {}
    });

    // ============================================
    // CONFIG SPÉCIFIQUE WHACK-A-MOLE
    // ============================================

    const DIFFICULTY_SETTINGS = {
      easy:      { spawnIntervalMs: 1100, moleVisibleMs: 1400, fakeFragmentChance: 0.0 },
      medium:    { spawnIntervalMs: 900,  moleVisibleMs: 1100, fakeFragmentChance: 0.15 },
      hard:      { spawnIntervalMs: 700,  moleVisibleMs: 850,  fakeFragmentChance: 0.25 },
      very_hard: { spawnIntervalMs: 550,  moleVisibleMs: 650,  fakeFragmentChance: 0.35 },
    };

    let settings = DIFFICULTY_SETTINGS.easy;

    function configureDifficulty(difficulty) {
      settings = DIFFICULTY_SETTINGS[difficulty] || DIFFICULTY_SETTINGS.easy;
      startGame();
    }

    const GRID_COLS = 3;
    const GRID_ROWS = 3;
    // 45 s de partie, puis un bonus de 45 s au plus : les gobelins sortent encore plus vite et les faux
    // fragments se multiplient, jusqu'à la dernière vie perdue ou la fin du bonus
    const GAME_DURATION_MS = 45000;
    const BONUS_MAX_MS = 45000;
    const HOLE_RADIUS = 45;
    const MAX_LIVES = 3;

    let scene;
    let holes = [];
    let score = 0;
    let lives = MAX_LIVES;
    let gameEnded = false;
    let spawnTimer = null;
    let countdownText;
    let scoreText;
    let livesText;
    let timeRemaining = GAME_DURATION_MS;
    let elapsedMs = 0;
    let bonusMode = false;
    let scoreAtBonus = 0; // score au début du temps additionnel : ce qui vient après est du bonus
    let stopButton = null;

    function preload() {}

    function create() {
      scene = this;
      const width = this.scale.width;
      const height = this.scale.height;

      const marginTop = 200;
      const marginBottom = 40;
      const marginX = 30;
      const playAreaHeight = height - marginTop - marginBottom;
      const cellWidth = (width - marginX * 2) / GRID_COLS;
      const cellHeight = playAreaHeight / GRID_ROWS * 0.55;

      for (let row = 0; row < GRID_ROWS; row++) {
        for (let col = 0; col < GRID_COLS; col++) {
          const x = marginX + cellWidth * col + cellWidth / 2;
          const y = marginTop + cellHeight * row + cellHeight / 2;

          const holeGraphic = this.add.circle(x, y, HOLE_RADIUS, 0x0a1420);
          holeGraphic.setStrokeStyle(2, 0x1a3050);

          holes.push({ x, y, occupied: false, isFake: false, sprite: null, hideTimer: null });
        }
      }

      // UI
      scoreText = this.add.text(20, 20, 'Score: 0', { fontSize: '20px', color: '#ffffff', fontStyle: 'bold' });
      countdownText = this.add.text(width - 100, 20, '45s', { fontSize: '20px', color: '#f59e0b', fontStyle: 'bold' });
      livesText = this.add.text(width / 2, 20, getLivesString(), { fontSize: '22px' }).setOrigin(0.5, 0);

      this.input.on('pointerdown', handlePointerDown);
      // Sur ordi : touches 1 à 9 disposées comme le pavé numérique (7 8 9 en haut, 1 2 3 en bas)
      this.input.keyboard.on('keydown', (event) => {
        const n = parseInt(event.key, 10);
        if (!(n >= 1 && n <= 9)) return;
        const row = GRID_ROWS - 1 - Math.floor((n - 1) / GRID_COLS);
        const col = (n - 1) % GRID_COLS;
        const hole = holes[row * GRID_COLS + col];
        if (hole) handlePointerDown({ x: hole.x, y: hole.y });
      });

      notifyReady();
    }

    // INIT est renvoyé à chaque « Rejouer » (le jeu reste chargé) : on repart toujours d'une partie propre
    let countdownEvent = null;
    function startGame() {
      if (spawnTimer) { spawnTimer.remove(); spawnTimer = null; }
      if (countdownEvent) { countdownEvent.remove(); countdownEvent = null; }
      holes.forEach((hole) => {
        if (hole.hideTimer) hole.hideTimer.remove();
        hideMole(hole);
      });
      score = 0;
      lives = MAX_LIVES;
      timeRemaining = GAME_DURATION_MS;
      elapsedMs = 0;
      bonusMode = false;
      if (stopButton) { stopButton.destroy(); stopButton = null; }
      countdownText.setColor('#f59e0b').setX(scene.scale.width - 100);
      gameEnded = false;
      scoreText.setText('Score: 0');
      livesText.setText(getLivesString());
      countdownText.setText(arcadeMode ? '⏱ 0s' : Math.ceil(GAME_DURATION_MS / 1000) + 's');

      scheduleNextSpawn();
      countdownEvent = scene.time.addEvent({
        delay: 1000,
        callback: tickCountdown,
        loop: true,
      });
    }

    function update() {}

    function getLivesString() {
      return '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
    }

    function bonusProgress() {
      return Phaser.Math.Clamp((elapsedMs - GAME_DURATION_MS) / BONUS_MAX_MS, 0, 1);
    }

    // Durées multipliées par ce ratio : 1 au début, 0.30 à la fin des 45 s, puis 0.18 à la fin du bonus
    // Onglet Jeux : pas de chrono ; ça accélère jusqu'à 0.18 en 2 min et la partie dure jusqu'à la dernière vie
    const ARCADE_RAMP_MS = 120000;
    function arcadeProgress() {
      return Math.min(1, elapsedMs / ARCADE_RAMP_MS);
    }

    function getSpeedRatio() {
      if (arcadeMode) return 1 - 0.82 * arcadeProgress();
      if (bonusMode) return 0.30 - 0.12 * bonusProgress();
      return 1 - 0.70 * Math.min(1, elapsedMs / GAME_DURATION_MS);
    }

    function scheduleNextSpawn() {
      if (gameEnded) return;
      const delay = Math.round(settings.spawnIntervalMs * getSpeedRatio());
      spawnTimer = scene.time.delayedCall(delay, () => {
        spawnMole();
        scheduleNextSpawn();
      });
    }

    function spawnMole() {
      if (gameEnded) return;

      const freeHoles = holes.filter((h) => !h.occupied);
      if (freeHoles.length === 0) return;

      const hole = freeHoles[Math.floor(Math.random() * freeHoles.length)];
      const isFake = Math.random() < (arcadeMode ? settings.fakeFragmentChance + 0.3 * arcadeProgress() : bonusMode ? Math.max(0.15, settings.fakeFragmentChance) * (1 + bonusProgress()) : settings.fakeFragmentChance);

      hole.occupied = true;
      hole.isFake = isFake;

      const emoji = isFake ? '✨' : '👺';

      const sprite = scene.add.text(hole.x, hole.y, emoji, { fontSize: '36px' }).setOrigin(0.5);
      sprite.setScale(0);
      scene.tweens.add({ targets: sprite, scale: 1, duration: 150, ease: 'Back.easeOut' });

      hole.sprite = sprite;

      hole.hideTimer = scene.time.delayedCall(Math.round(settings.moleVisibleMs * getSpeedRatio()), () => {
        if (!hole.isFake) loseLife();
        hideMole(hole);
      });
    }

    function hideMole(hole) {
      if (hole.sprite) {
        hole.sprite.destroy();
        hole.sprite = null;
      }
      hole.occupied = false;
      hole.isFake = false;
    }

    function loseLife() {
      if (gameEnded) return;
      lives = Math.max(0, lives - 1);
      sfx('powerdown');
      livesText.setText(getLivesString());
      if (lives <= 0) {
        finishGame();
      }
    }

    function handlePointerDown(pointer) {
      if (gameEnded) return;
      if (stopButton && stopButton.getBounds().contains(pointer.x, pointer.y)) {
        finishGame();
        return;
      }

      for (const hole of holes) {
        if (!hole.occupied) continue;
        const distance = Phaser.Math.Distance.Between(pointer.x, pointer.y, hole.x, hole.y);
        if (distance <= HOLE_RADIUS) {
          if (hole.isFake) {
            score = Math.max(0, score - 50);
            sfx('hurt');
            flashFeedback(hole.x, hole.y, '-50', 0xef4444);
          } else {
            score += 100;
            sfx('whack');
            flashFeedback(hole.x, hole.y, '+100', 0x34d399);
          }
          if (hole.hideTimer) hole.hideTimer.remove();
          hideMole(hole);
          scoreText.setText('Score: ' + score);
          break;
        }
      }
    }

    function flashFeedback(x, y, text, color) {
      const feedback = scene.add.text(x, y - 20, text, { fontSize: '18px', color: '#' + color.toString(16).padStart(6, '0'), fontStyle: 'bold' }).setOrigin(0.5);
      scene.tweens.add({
        targets: feedback,
        y: y - 60,
        alpha: 0,
        duration: 600,
        onComplete: () => feedback.destroy(),
      });
    }

    function tickCountdown() {
      if (gameEnded) return;
      elapsedMs += 1000;
      if (arcadeMode) {
        countdownText.setText('⏱ ' + Math.round(elapsedMs / 1000) + 's');
        return;
      }
      timeRemaining -= 1000;
      const secondsLeft = Math.max(0, Math.ceil(timeRemaining / 1000));
      countdownText.setText((bonusMode ? 'Bonus ' : '') + secondsLeft + 's');

      if (timeRemaining <= 0) {
        if (bonusMode) finishGame();
        else startBonus();
      }
    }

    // 45 s tenues : on continue pour des points en plus
    function startBonus() {
      scoreAtBonus = Math.floor(score);
      bonusMode = true;
      timeRemaining = BONUS_MAX_MS;
      sfx('powerup');
      const width = scene.scale.width;
      countdownText.setText('Bonus ' + Math.round(BONUS_MAX_MS / 1000) + 's').setColor('#fbbf24').setX(width - 130);
      const banner = scene.add.text(width / 2, 120, T('🎉 Objectif atteint !\nContinue pour des points bonus\n(ça va accélérer !)', '🎉 Goal reached!\nKeep going for bonus points\n(it’ll speed up!)'), {
        fontSize: '16px', color: '#fbbf24', fontStyle: 'bold', align: 'center', stroke: '#0c1521', strokeThickness: 5,
        wordWrap: { width: width - 24 },
      }).setOrigin(0.5).setDepth(20);
      scene.tweens.add({ targets: banner, alpha: 0, delay: 2200, duration: 700, onComplete: () => banner.destroy() });
      stopButton = scene.add.text(width - 20, 52, T('✓ Terminer', '✓ Finish'), {
        fontSize: '15px', color: '#ffffff', fontStyle: 'bold', backgroundColor: '#7c3aed', padding: { x: 10, y: 6 },
      }).setOrigin(1, 0).setDepth(20);
    }

    function finishGame() {
      if (gameEnded) return;
      gameEnded = true;
      if (spawnTimer) spawnTimer.remove();

      const success = score > 0;
      scene.time.delayedCall(300, () => {
        endGame(success, score, bonusMode ? score - scoreAtBonus : 0);
      });
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: 'rgba(0,0,0,0)',
      transparent: true,
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
      },
      scene: { preload, create, update },
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
