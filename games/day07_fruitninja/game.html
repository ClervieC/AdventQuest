<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #game-container { width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    // ============================================
    // PONT DE COMMUNICATION — ne pas modifier
    // ============================================
    function sendToReactNative(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      } else {
        console.log('[DEV MODE]', message);
      }
    }
    // Bruitage (moteur injecté par l'app, silencieux si le son est coupé)
    function sfx(name) {
      if (window.GameSounds) window.GameSounds.play(name);
    }
    // Texte dans la langue du joueur (injectée par l'app ; français si le HTML est ouvert seul)
    function T(fr, en) {
      return window.GAME_LANG === 'en' ? en : fr;
    }
    function endGame(success, score) {
      sendToReactNative({ type: 'GAME_OVER', success, score });
    }
    function notifyReady() {
      sendToReactNative({ type: 'GAME_READY' });
    }

    let currentDifficulty = 'easy';
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'INIT') {
          currentDifficulty = data.difficulty;
          configureDifficulty(currentDifficulty);
        }
      } catch (e) {}
    });

    // ============================================
    // CONFIG SPÉCIFIQUE FRUIT NINJA
    // ============================================

    const DIFFICULTY_SETTINGS = {
      // speed : vitesse de vol (la hauteur atteinte ne change pas, seuls la montée et la chute sont plus rapides)
      easy:      { spawnIntervalMs: 1100, bombChance: 0.1,  speed: 1.0 },
      medium:    { spawnIntervalMs: 850,  bombChance: 0.18, speed: 1.1 },
      hard:      { spawnIntervalMs: 650,  bombChance: 0.25, speed: 1.2 },
      very_hard: { spawnIntervalMs: 500,  bombChance: 0.32, speed: 1.3 },
    };

    let settings = DIFFICULTY_SETTINGS.easy;
    function configureDifficulty(difficulty) {
      settings = DIFFICULTY_SETTINGS[difficulty] || DIFFICULTY_SETTINGS.easy;
      startGame();
    }

    // Vitesse (vol des friandises et fréquence d'apparition) au fil de la partie :
    // lent au début (0.6), accélère jusqu'à 1.2 à la fin des 60 s, puis de plus en plus vite en bonus
    // (+0.8 toutes les 30 s, plafonné à 2.6 pour rester jouable).
    const SPEED_START = 0.6;
    const SPEED_AT_GOAL = 1.2;
    const BONUS_SPEEDUP_PER_30S = 0.8;
    const SPEED_MAX = 2.6;
    function getSpeedRatio() {
      if (elapsedMs <= GAME_DURATION_MS) {
        return SPEED_START + (SPEED_AT_GOAL - SPEED_START) * (elapsedMs / GAME_DURATION_MS);
      }
      const bonusSeconds = (elapsedMs - GAME_DURATION_MS) / 1000;
      return Math.min(SPEED_MAX, SPEED_AT_GOAL + BONUS_SPEEDUP_PER_30S * (bonusSeconds / 30));
    }

    function scheduleNextSpawn() {
      if (gameEnded) return;
      const delay = Math.round(settings.spawnIntervalMs / getSpeedRatio());
      spawnTimer = scene.time.delayedCall(delay, () => {
        spawnObject();
        scheduleNextSpawn();
      });
    }

    // INIT est renvoyé à chaque « Rejouer » (le jeu reste chargé) : on repart toujours d'une partie propre
    let countdownEvent = null;
    function resetGame() {
      if (spawnTimer) { spawnTimer.remove(); spawnTimer = null; }
      if (countdownEvent) { countdownEvent.remove(); countdownEvent = null; }
      objects.forEach((obj) => obj.sprite.destroy());
      objects = [];
      trailPoints = [];
      isPointerDown = false;
      score = 0;
      elapsedMs = 0;
      bonusMode = false;
      gameEnded = false;
      if (stopButton) { stopButton.destroy(); stopButton = null; }
      scoreText.setText('Score: 0');
      timerText.setText(Math.round(GAME_DURATION_MS / 1000) + 's').setColor('#f59e0b');
    }

    function startGame() {
      resetGame();
      // Consigne claire au démarrage
      const hint = scene.add.text(scene.scale.width / 2, scene.scale.height * 0.4, T('Coupe les friandises 🍎🍪🪵\nÉvite les bombes 💣 !', 'Slice the treats 🍎🍪🪵\nAvoid the bombs 💣!'), {
        fontSize: '20px', color: '#ffffff', fontStyle: 'bold', align: 'center', stroke: '#0c1521', strokeThickness: 5,
      }).setOrigin(0.5).setDepth(20);
      scene.tweens.add({ targets: hint, alpha: 0, delay: 2600, duration: 700, onComplete: () => hint.destroy() });
      scheduleNextSpawn();
      countdownEvent = scene.time.addEvent({ delay: 1000, callback: tickCountdown, loop: true });
    }

    // Objectif : tenir 60 s sans toucher de bombe. Ensuite, la partie continue en bonus :
    // chaque friandise rapporte encore des points, et une bombe termine la partie sans la faire perdre.
    const GAME_DURATION_MS = 60000;
    const GRAVITY = 1100;
    // Hauteur de montée, en part de la hauteur d'écran : les fruits montent entre 55 % et 85 % de l'écran
    const RISE_MIN = 0.55;
    const RISE_MAX = 0.85;
    const OBJECT_RADIUS = 28;
    const TREATS = ['🍎', '🍊', '🍐', '🍪', '🧁', '🍭', '🪵']; // 🪵 = la bûche de Noël

    let scene;
    let objects = [];        // { sprite, x, y, vx, vy, gravity, isBomb, sliced }
    let trailPoints = [];    // historique récent des positions du doigt pour le tracé visuel
    let score = 0;
    let gameEnded = false;
    let spawnTimer = null;
    let scoreText, timerText;
    let elapsedMs = 0;
    let bonusMode = false;
    let stopButton = null;
    let isPointerDown = false;
    let lastPointerPos = null;
    let trailGraphics;

    function preload() {}

    function create() {
      scene = this;
      const width = this.scale.width;

      trailGraphics = this.add.graphics();

      scoreText = this.add.text(20, 20, 'Score: 0', { fontSize: '20px', color: '#ffffff', fontStyle: 'bold' });
      timerText = this.add.text(width - 20, 20, '60s', { fontSize: '20px', color: '#f59e0b', fontStyle: 'bold' }).setOrigin(1, 0);

      this.input.on('pointerdown', (pointer) => {
        // Bouton « Terminer » du mode bonus : pas de tranchage dessus
        if (stopButton && stopButton.getBounds().contains(pointer.x, pointer.y)) {
          finishGame(true);
          return;
        }
        isPointerDown = true;
        lastPointerPos = { x: pointer.x, y: pointer.y };
        trailPoints = [{ x: pointer.x, y: pointer.y }];
      });

      this.input.on('pointermove', (pointer) => {
        if (!isPointerDown) return;
        const newPos = { x: pointer.x, y: pointer.y };
        checkSliceCollision(lastPointerPos, newPos);
        trailPoints.push(newPos);
        if (trailPoints.length > 10) trailPoints.shift();
        lastPointerPos = newPos;
      });

      this.input.on('pointerup', () => {
        isPointerDown = false;
        trailPoints = [];
      });

      notifyReady();
    }

    function spawnObject() {
      if (gameEnded) return;

      const width = scene.scale.width;
      const height = scene.scale.height;
      const isBomb = Math.random() < settings.bombChance;

      const x = width * 0.2 + Math.random() * width * 0.6;
      const y = height + 40;
      // Vitesse de lancement calculée pour atteindre la hauteur voulue (sommet = v² / 2g).
      // Pour accélérer sans changer la hauteur : vitesse × k et gravité × k².
      const k = getSpeedRatio() * settings.speed;
      const gravity = GRAVITY * k * k;
      const rise = (y - height) + height * (RISE_MIN + Math.random() * (RISE_MAX - RISE_MIN));
      const vy = -Math.sqrt(2 * gravity * rise);
      const vx = (Math.random() - 0.5) * 200 * k;

      // Friandises de Noël à couper ; les bombes ont un halo rouge pour ne jamais les confondre
      let sprite;
      if (isBomb) {
        const halo = scene.add.circle(0, 0, OBJECT_RADIUS + 4, 0xef4444, 0.35).setStrokeStyle(3, 0xef4444);
        const bomb = scene.add.text(0, 0, '💣', { fontSize: OBJECT_RADIUS * 1.5 + 'px' }).setOrigin(0.5);
        sprite = scene.add.container(x, y, [halo, bomb]);
      } else {
        const emoji = TREATS[Math.floor(Math.random() * TREATS.length)];
        sprite = scene.add.text(x, y, emoji, { fontSize: OBJECT_RADIUS * 1.6 + 'px' }).setOrigin(0.5);
      }
      sprite.spin = (Math.random() - 0.5) * 4;

      objects.push({ sprite, x, y, vx, vy, gravity, isBomb, sliced: false });
    }

    function checkSliceCollision(from, to) {
      objects.forEach((obj) => {
        if (obj.sliced) return;
        const distance = distanceFromSegmentToPoint(from, to, { x: obj.x, y: obj.y });
        if (distance <= OBJECT_RADIUS) {
          sliceObject(obj);
        }
      });
    }

    /** Distance la plus courte entre un segment [from, to] et un point */
    function distanceFromSegmentToPoint(from, to, point) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const lengthSquared = dx * dx + dy * dy;

      if (lengthSquared === 0) {
        return Phaser.Math.Distance.Between(from.x, from.y, point.x, point.y);
      }

      let t = ((point.x - from.x) * dx + (point.y - from.y) * dy) / lengthSquared;
      t = Phaser.Math.Clamp(t, 0, 1);

      const closestX = from.x + t * dx;
      const closestY = from.y + t * dy;

      return Phaser.Math.Distance.Between(point.x, point.y, closestX, closestY);
    }

    function sliceObject(obj) {
      obj.sliced = true;
      obj.sprite.destroy();

      if (obj.isBomb) {
        sfx('explode');
        // Pendant les 60 s : perdu. En bonus : l'objectif est déjà atteint, la partie s'arrête avec le score
        finishGame(bonusMode);
        return;
      }
      sfx('slice');

      score += 30;
      scoreText.setText('Score: ' + score);

      // petit effet de feedback visuel (en or pendant le bonus)
      const feedback = scene.add.text(obj.x, obj.y, bonusMode ? '+30 bonus' : '+30', { fontSize: '18px', color: bonusMode ? '#fbbf24' : '#34d399', fontStyle: 'bold' }).setOrigin(0.5);
      scene.tweens.add({ targets: feedback, y: obj.y - 40, alpha: 0, duration: 500, onComplete: () => feedback.destroy() });
    }

    function update(time, delta) {
      if (gameEnded) return;

      const dt = delta / 1000;

      objects = objects.filter((obj) => {
        if (obj.sliced) return false;

        obj.vy += (obj.gravity || GRAVITY) * dt;
        obj.x += obj.vx * dt;
        obj.y += obj.vy * dt;
        obj.sprite.x = obj.x;
        obj.sprite.y = obj.y;
        obj.sprite.angle += obj.sprite.spin;

        if (obj.y > scene.scale.height + 60) {
          obj.sprite.destroy();
          return false;
        }
        return true;
      });

      // Dessine la traînée du doigt
      trailGraphics.clear();
      if (trailPoints.length > 1) {
        trailGraphics.lineStyle(4, 0xffffff, 0.5);
        trailGraphics.beginPath();
        trailGraphics.moveTo(trailPoints[0].x, trailPoints[0].y);
        for (let i = 1; i < trailPoints.length; i++) {
          trailGraphics.lineTo(trailPoints[i].x, trailPoints[i].y);
        }
        trailGraphics.strokePath();
      }
    }

    function tickCountdown() {
      if (gameEnded) return;
      elapsedMs += 1000;
      if (!bonusMode) {
        const secondsLeft = Math.max(0, Math.ceil((GAME_DURATION_MS - elapsedMs) / 1000));
        timerText.setText(secondsLeft + 's');
        if (elapsedMs >= GAME_DURATION_MS) startBonus();
      } else {
        timerText.setText('Bonus +' + Math.round((elapsedMs - GAME_DURATION_MS) / 1000) + 's');
      }
    }

    // 60 s tenues : fragment gagné, on continue pour des points en plus
    function startBonus() {
      bonusMode = true;
      sfx('powerup');
      timerText.setText('Bonus +0s').setColor('#fbbf24');
      const banner = scene.add.text(scene.scale.width / 2, scene.scale.height * 0.35, T('🎉 Objectif atteint !\nContinue pour des points bonus', '🎉 Goal reached!\nKeep going for bonus points'), {
        fontSize: '17px', color: '#fbbf24', fontStyle: 'bold', align: 'center', stroke: '#0c1521', strokeThickness: 5,
        wordWrap: { width: scene.scale.width - 24 },
      }).setOrigin(0.5).setDepth(20);
      scene.tweens.add({ targets: banner, alpha: 0, delay: 2200, duration: 700, onComplete: () => banner.destroy() });
      stopButton = scene.add.text(scene.scale.width - 20, 52, T('✓ Terminer', '✓ Finish'), {
        fontSize: '15px', color: '#ffffff', fontStyle: 'bold', backgroundColor: '#7c3aed', padding: { x: 10, y: 6 },
      }).setOrigin(1, 0).setDepth(20);
    }

    function finishGame(success) {
      if (gameEnded) return;
      gameEnded = true;
      if (spawnTimer) { spawnTimer.remove(); spawnTimer = null; }

      scene.time.delayedCall(300, () => {
        endGame(success && score > 0, score);
      });
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: 'rgba(0,0,0,0)',
      transparent: true,
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
      },
      scene: { preload, create, update },
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
