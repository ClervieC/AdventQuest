<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #game-container { width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    // ============================================
    // PONT DE COMMUNICATION — ne pas modifier
    // ============================================
    function sendToReactNative(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      } else {
        console.log('[DEV MODE]', message);
      }
    }
    // Bruitage (moteur injecté par l'app, silencieux si le son est coupé)
    function sfx(name) {
      if (window.GameSounds) window.GameSounds.play(name);
    }
    // Texte dans la langue du joueur (injectée par l'app ; français si le HTML est ouvert seul)
    function T(fr, en) {
      return window.GAME_LANG === 'en' ? en : fr;
    }
    function endGame(success, score) {
      sendToReactNative({ type: 'GAME_OVER', success, score });
    }
    function notifyReady() {
      sendToReactNative({ type: 'GAME_READY' });
    }

    let currentDifficulty = 'easy';
    let arcadeMode = false; // onglet Jeux : partie sans fin (ou par niveaux), sans objectif du jour
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'INIT') {
          arcadeMode = data.arcade === true;
          currentDifficulty = data.difficulty;
          configureDifficulty(currentDifficulty);
        }
      } catch (e) {}
    });

    // ============================================
    // CONFIG SPÉCIFIQUE FRUIT NINJA
    // ============================================

    const DIFFICULTY_SETTINGS = {
      // speed : vitesse de vol (la hauteur atteinte ne change pas, seuls la montée et la chute sont plus rapides)
      easy:      { spawnIntervalMs: 1100, bombChance: 0.1,  speed: 1.0 },
      medium:    { spawnIntervalMs: 850,  bombChance: 0.18, speed: 1.1 },
      hard:      { spawnIntervalMs: 650,  bombChance: 0.25, speed: 1.2 },
      very_hard: { spawnIntervalMs: 500,  bombChance: 0.32, speed: 1.3 },
    };

    let settings = DIFFICULTY_SETTINGS.easy;
    function configureDifficulty(difficulty) {
      settings = DIFFICULTY_SETTINGS[difficulty] || DIFFICULTY_SETTINGS.easy;
      startGame();
    }

    // Vitesse (vol des friandises et fréquence d'apparition) au fil de la partie :
    // lent au début (0.6), accélère jusqu'à 1.2 à la fin des 60 s, puis de plus en plus vite pendant le bonus
    // jusqu'à 2.6 à la dernière seconde. Les bombes deviennent aussi plus fréquentes : le bonus finit par s'arrêter.
    const SPEED_START = 0.6;
    const SPEED_AT_GOAL = 1.2;
    const SPEED_MAX = 2.6;
    // Onglet Jeux : pas d'objectif, ça accélère de 0.6 à 2.6 en 2 min 30 et la partie dure jusqu'à la 1re bombe
    const ARCADE_RAMP_MS = 150000;
    function bonusProgress() {
      if (arcadeMode) return Math.min(1, elapsedMs / ARCADE_RAMP_MS);
      return Phaser.Math.Clamp((elapsedMs - GAME_DURATION_MS) / BONUS_MAX_MS, 0, 1);
    }
    function getSpeedRatio() {
      if (arcadeMode) return SPEED_START + (SPEED_MAX - SPEED_START) * bonusProgress();
      if (elapsedMs <= GAME_DURATION_MS) {
        return SPEED_START + (SPEED_AT_GOAL - SPEED_START) * (elapsedMs / GAME_DURATION_MS);
      }
      return SPEED_AT_GOAL + (SPEED_MAX - SPEED_AT_GOAL) * bonusProgress();
    }

    function scheduleNextSpawn() {
      if (gameEnded) return;
      const delay = Math.round(settings.spawnIntervalMs / getSpeedRatio());
      spawnTimer = scene.time.delayedCall(delay, () => {
        spawnObject();
        scheduleNextSpawn();
      });
    }

    // INIT est renvoyé à chaque « Rejouer » (le jeu reste chargé) : on repart toujours d'une partie propre
    let countdownEvent = null;
    function resetGame() {
      if (spawnTimer) { spawnTimer.remove(); spawnTimer = null; }
      if (countdownEvent) { countdownEvent.remove(); countdownEvent = null; }
      objects.forEach((obj) => obj.sprite.destroy());
      objects = [];
      pieces.forEach((piece) => piece.sprite.destroy());
      pieces = [];
      trailPoints = [];
      isPointerDown = false;
      score = 0;
      elapsedMs = 0;
      bonusMode = false;
      gameEnded = false;
      if (stopButton) { stopButton.destroy(); stopButton = null; }
      scoreText.setText('Score: 0');
      timerText.setText(arcadeMode ? '⏱ 0s' : Math.round(GAME_DURATION_MS / 1000) + 's').setColor('#f59e0b');
    }

    function startGame() {
      resetGame();
      // Consigne claire au démarrage
      const hint = scene.add.text(scene.scale.width / 2, scene.scale.height * 0.4, T('Coupe les friandises 🍎🍪🪵\nÉvite les bombes 💣 !', 'Slice the treats 🍎🍪🪵\nAvoid the bombs 💣!'), {
        fontSize: '20px', color: '#ffffff', fontStyle: 'bold', align: 'center', stroke: '#0c1521', strokeThickness: 5,
      }).setOrigin(0.5).setDepth(20);
      scene.tweens.add({ targets: hint, alpha: 0, delay: 2600, duration: 700, onComplete: () => hint.destroy() });
      scheduleNextSpawn();
      countdownEvent = scene.time.addEvent({ delay: 1000, callback: tickCountdown, loop: true });
    }

    // Objectif : tenir 60 s sans toucher de bombe. Ensuite, la partie continue en bonus (60 s au plus) :
    // chaque friandise rapporte encore des points, et une bombe termine la partie sans la faire perdre.
    const GAME_DURATION_MS = 60000;
    const BONUS_MAX_MS = 60000;
    // Il faut un vrai geste de coupe : le doigt doit traverser la friandise assez vite (px/ms).
    // Poser le doigt dessus ou le glisser lentement ne tranche rien.
    const SLICE_MIN_SPEED = 0.45;
    const TRAIL_LIFETIME_MS = 140;
    const JUICE_COLORS = { '🍎': 0xef4444, '🍊': 0xfb923c, '🍐': 0xa3e635, '🍪': 0xd6a26b, '🧁': 0xf9a8d4, '🍭': 0xe879f9, '🪵': 0x92400e };
    const GRAVITY = 1100;
    // Hauteur de montée, en part de la hauteur d'écran : les fruits montent entre 55 % et 85 % de l'écran
    const RISE_MIN = 0.55;
    const RISE_MAX = 0.85;
    const OBJECT_RADIUS = 28;
    const TREATS = ['🍎', '🍊', '🍐', '🍪', '🧁', '🍭', '🪵']; // 🪵 = la bûche de Noël

    let scene;
    let objects = [];        // { sprite, x, y, vx, vy, gravity, isBomb, sliced, emoji }
    let pieces = [];         // moitiés de friandises tranchées qui retombent : { sprite, vx, vy, gravity, spin }
    let trailPoints = [];    // positions récentes du doigt { x, y, t } pour la lame (effacées au bout de 140 ms)
    let score = 0;
    let gameEnded = false;
    let spawnTimer = null;
    let scoreText, timerText;
    let elapsedMs = 0;
    let bonusMode = false;
    let stopButton = null;
    let isPointerDown = false;
    let lastPointerPos = null;
    let trailGraphics;

    function preload() {}

    function create() {
      scene = this;
      const width = this.scale.width;

      trailGraphics = this.add.graphics();

      scoreText = this.add.text(20, 20, 'Score: 0', { fontSize: '20px', color: '#ffffff', fontStyle: 'bold' });
      timerText = this.add.text(width - 20, 20, '60s', { fontSize: '20px', color: '#f59e0b', fontStyle: 'bold' }).setOrigin(1, 0);

      this.input.on('pointerdown', (pointer) => {
        // Bouton « Terminer » du mode bonus : pas de tranchage dessus
        if (stopButton && stopButton.getBounds().contains(pointer.x, pointer.y)) {
          finishGame(true);
          return;
        }
        isPointerDown = true;
        lastPointerPos = { x: pointer.x, y: pointer.y, t: scene.time.now };
        trailPoints = [lastPointerPos];
      });

      this.input.on('pointermove', (pointer) => {
        if (!isPointerDown) return;
        const newPos = { x: pointer.x, y: pointer.y, t: scene.time.now };
        const length = Phaser.Math.Distance.Between(lastPointerPos.x, lastPointerPos.y, newPos.x, newPos.y);
        const speed = length / Math.max(1, newPos.t - lastPointerPos.t);
        if (speed >= SLICE_MIN_SPEED) checkSliceCollision(lastPointerPos, newPos);
        trailPoints.push(newPos);
        lastPointerPos = newPos;
      });

      // La lame s'efface d'elle-même (drawBlade) : pas de coupure nette au lever du doigt
      this.input.on('pointerup', () => {
        isPointerDown = false;
      });

      notifyReady();
    }

    function spawnObject() {
      if (gameEnded) return;

      const width = scene.scale.width;
      const height = scene.scale.height;
      // En bonus, jusqu'à deux fois plus de bombes à la fin
      const isBomb = Math.random() < settings.bombChance * (1 + bonusProgress());

      const x = width * 0.2 + Math.random() * width * 0.6;
      const y = height + 40;
      // Vitesse de lancement calculée pour atteindre la hauteur voulue (sommet = v² / 2g).
      // Pour accélérer sans changer la hauteur : vitesse × k et gravité × k².
      const k = getSpeedRatio() * settings.speed;
      const gravity = GRAVITY * k * k;
      const rise = (y - height) + height * (RISE_MIN + Math.random() * (RISE_MAX - RISE_MIN));
      const vy = -Math.sqrt(2 * gravity * rise);
      // Point de chute choisi DANS l'écran : la friandise va en ligne droite (horizontalement) de son départ
      // à ce point pendant tout son vol, elle ne sort donc jamais sur le côté, même sur un petit écran.
      // Durée du vol ≈ montée + redescente jusqu'au bas de l'écran = 2 × |vy| / gravité.
      const flightTime = (2 * -vy) / gravity;
      const margin = OBJECT_RADIUS + 12;
      const landingX = Phaser.Math.Clamp(x + (Math.random() - 0.5) * width * 0.7, margin, width - margin);
      const vx = (landingX - x) / flightTime;

      // Friandises de Noël à couper ; les bombes ont un halo rouge pour ne jamais les confondre
      let sprite;
      let emoji = null;
      if (isBomb) {
        const halo = scene.add.circle(0, 0, OBJECT_RADIUS + 4, 0xef4444, 0.35).setStrokeStyle(3, 0xef4444);
        const bomb = scene.add.text(0, 0, '💣', { fontSize: OBJECT_RADIUS * 1.5 + 'px' }).setOrigin(0.5);
        sprite = scene.add.container(x, y, [halo, bomb]);
      } else {
        emoji = TREATS[Math.floor(Math.random() * TREATS.length)];
        sprite = scene.add.text(x, y, emoji, { fontSize: OBJECT_RADIUS * 1.6 + 'px' }).setOrigin(0.5);
      }
      sprite.spin = (Math.random() - 0.5) * 4;

      objects.push({ sprite, x, y, vx, vy, gravity, isBomb, emoji, sliced: false });
    }

    function checkSliceCollision(from, to) {
      objects.forEach((obj) => {
        if (obj.sliced) return;
        const distance = distanceFromSegmentToPoint(from, to, { x: obj.x, y: obj.y });
        if (distance <= OBJECT_RADIUS) {
          sliceObject(obj, from, to);
        }
      });
    }

    /** Distance la plus courte entre un segment [from, to] et un point */
    function distanceFromSegmentToPoint(from, to, point) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const lengthSquared = dx * dx + dy * dy;

      if (lengthSquared === 0) {
        return Phaser.Math.Distance.Between(from.x, from.y, point.x, point.y);
      }

      let t = ((point.x - from.x) * dx + (point.y - from.y) * dy) / lengthSquared;
      t = Phaser.Math.Clamp(t, 0, 1);

      const closestX = from.x + t * dx;
      const closestY = from.y + t * dy;

      return Phaser.Math.Distance.Between(point.x, point.y, closestX, closestY);
    }

    function sliceObject(obj, from, to) {
      obj.sliced = true;
      obj.sprite.destroy();
      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      drawSlash(obj.x, obj.y, angle);

      if (obj.isBomb) {
        sfx('explode');
        explode(obj.x, obj.y);
        // Pendant les 60 s : perdu. En bonus : l'objectif est déjà atteint, la partie s'arrête avec le score
        finishGame(bonusMode || arcadeMode);
        return;
      }
      sfx('slice');
      splitTreat(obj, angle);
      splashJuice(obj.x, obj.y, JUICE_COLORS[obj.emoji] || 0xffffff);

      score += 30;
      scoreText.setText('Score: ' + score);

      // petit effet de feedback visuel (en or pendant le bonus)
      const feedback = scene.add.text(obj.x, obj.y, bonusMode ? '+30 bonus' : '+30', { fontSize: '18px', color: bonusMode ? '#fbbf24' : '#34d399', fontStyle: 'bold' }).setOrigin(0.5);
      scene.tweens.add({ targets: feedback, y: obj.y - 40, alpha: 0, duration: 500, onComplete: () => feedback.destroy() });
    }

    function update(time, delta) {
      if (gameEnded) return;

      const dt = delta / 1000;

      objects = objects.filter((obj) => {
        if (obj.sliced) return false;

        obj.vy += (obj.gravity || GRAVITY) * dt;
        obj.x += obj.vx * dt;
        obj.y += obj.vy * dt;
        obj.sprite.x = obj.x;
        obj.sprite.y = obj.y;
        obj.sprite.angle += obj.sprite.spin;

        if (obj.y > scene.scale.height + 60) {
          obj.sprite.destroy();
          return false;
        }
        return true;
      });

      updatePieces(dt);
      drawBlade(time);
    }

    // Lame : traînée qui s'affine et s'efface vers la queue (seulement les 140 dernières ms du geste)
    function drawBlade(now) {
      trailPoints = trailPoints.filter((p) => now - p.t <= TRAIL_LIFETIME_MS);
      trailGraphics.clear();
      for (let i = 1; i < trailPoints.length; i++) {
        const k = i / (trailPoints.length - 1);
        trailGraphics.lineStyle(2 + 7 * k, 0xffffff, 0.15 + 0.75 * k);
        trailGraphics.lineBetween(trailPoints[i - 1].x, trailPoints[i - 1].y, trailPoints[i].x, trailPoints[i].y);
      }
    }

    // Trait lumineux à l'endroit de la coupe
    function drawSlash(x, y, angle) {
      const half = OBJECT_RADIUS + 18;
      const slash = scene.add.graphics().setDepth(15);
      slash.lineStyle(3, 0xffffff, 0.95);
      slash.lineBetween(x - Math.cos(angle) * half, y - Math.sin(angle) * half, x + Math.cos(angle) * half, y + Math.sin(angle) * half);
      scene.tweens.add({ targets: slash, alpha: 0, duration: 220, onComplete: () => slash.destroy() });
    }

    // La friandise est coupée en deux dans le sens du geste : les deux moitiés s'écartent et retombent en tournant
    function splitTreat(obj, angle) {
      const normalX = -Math.sin(angle);
      const normalY = Math.cos(angle);
      [-1, 1].forEach((side) => {
        const half = scene.add.text(obj.x, obj.y, obj.emoji, { fontSize: OBJECT_RADIUS * 1.6 + 'px' }).setOrigin(0.5).setDepth(5);
        // Moitié haute ou basse de l'emoji, tournée pour que la coupe suive le geste
        const h = half.height / 2;
        half.setCrop(0, side < 0 ? 0 : h, half.width, h);
        half.setRotation(angle);
        pieces.push({
          sprite: half,
          vx: obj.vx * 0.5 + normalX * side * 160,
          vy: Math.min(obj.vy, 0) * 0.3 + normalY * side * 160 - 120,
          gravity: obj.gravity || GRAVITY,
          spin: side * (4 + Math.random() * 4),
        });
      });
    }

    function updatePieces(dt) {
      pieces = pieces.filter((piece) => {
        piece.vy += piece.gravity * dt;
        piece.sprite.x += piece.vx * dt;
        piece.sprite.y += piece.vy * dt;
        piece.sprite.angle += piece.spin;
        if (piece.sprite.y > scene.scale.height + 60) {
          piece.sprite.destroy();
          return false;
        }
        return true;
      });
    }

    // Éclaboussure de jus de la couleur du fruit
    function splashJuice(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const drop = scene.add.circle(x, y, 3 + Math.random() * 4, color, 0.9).setDepth(4);
        const a = Math.random() * Math.PI * 2;
        const d = 25 + Math.random() * 35;
        scene.tweens.add({
          targets: drop,
          x: x + Math.cos(a) * d,
          y: y + Math.sin(a) * d + 15,
          scale: 0.3,
          alpha: 0,
          duration: 380 + Math.random() * 200,
          ease: 'Quad.easeOut',
          onComplete: () => drop.destroy(),
        });
      }
    }

    function explode(x, y) {
      const blast = scene.add.circle(x, y, OBJECT_RADIUS, 0xfbbf24, 0.9).setDepth(15);
      scene.tweens.add({ targets: blast, scale: 4, alpha: 0, duration: 350, onComplete: () => blast.destroy() });
      scene.cameras.main.shake(220, 0.012);
    }

    function tickCountdown() {
      if (gameEnded) return;
      elapsedMs += 1000;
      if (arcadeMode) {
        timerText.setText('⏱ ' + Math.round(elapsedMs / 1000) + 's');
        return;
      }
      if (!bonusMode) {
        const secondsLeft = Math.max(0, Math.ceil((GAME_DURATION_MS - elapsedMs) / 1000));
        timerText.setText(secondsLeft + 's');
        if (elapsedMs >= GAME_DURATION_MS) startBonus();
      } else {
        const bonusLeft = Math.max(0, Math.ceil((GAME_DURATION_MS + BONUS_MAX_MS - elapsedMs) / 1000));
        timerText.setText('Bonus ' + bonusLeft + 's');
        if (bonusLeft <= 0) finishGame(true);
      }
    }

    // 60 s tenues : fragment gagné, on continue pour des points en plus
    function startBonus() {
      bonusMode = true;
      sfx('powerup');
      timerText.setText('Bonus ' + Math.round(BONUS_MAX_MS / 1000) + 's').setColor('#fbbf24');
      const banner = scene.add.text(scene.scale.width / 2, scene.scale.height * 0.35, T('🎉 Objectif atteint !\nContinue pour des points bonus\n(ça va accélérer !)', '🎉 Goal reached!\nKeep going for bonus points\n(it’ll speed up!)'), {
        fontSize: '17px', color: '#fbbf24', fontStyle: 'bold', align: 'center', stroke: '#0c1521', strokeThickness: 5,
        wordWrap: { width: scene.scale.width - 24 },
      }).setOrigin(0.5).setDepth(20);
      scene.tweens.add({ targets: banner, alpha: 0, delay: 2200, duration: 700, onComplete: () => banner.destroy() });
      stopButton = scene.add.text(scene.scale.width - 20, 52, T('✓ Terminer', '✓ Finish'), {
        fontSize: '15px', color: '#ffffff', fontStyle: 'bold', backgroundColor: '#7c3aed', padding: { x: 10, y: 6 },
      }).setOrigin(1, 0).setDepth(20);
    }

    function finishGame(success) {
      if (gameEnded) return;
      gameEnded = true;
      if (spawnTimer) { spawnTimer.remove(); spawnTimer = null; }

      scene.time.delayedCall(300, () => {
        endGame(success && score > 0, score);
      });
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: 'rgba(0,0,0,0)',
      transparent: true,
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
      },
      scene: { preload, create, update },
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
