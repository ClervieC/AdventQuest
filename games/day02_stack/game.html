<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #game-container { width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    // ============================================
    // PONT DE COMMUNICATION — ne pas modifier
    // ============================================
    function sendToReactNative(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      } else {
        console.log('[DEV MODE]', message);
      }
    }
    // Bruitage (moteur injecté par l'app, silencieux si le son est coupé)
    function sfx(name) {
      if (window.GameSounds) window.GameSounds.play(name);
    }
    // Texte dans la langue du joueur (injectée par l'app ; français si le HTML est ouvert seul)
    function T(fr, en) {
      return window.GAME_LANG === 'en' ? en : fr;
    }
    // bonus : part du score gagnée en temps additionnel (non plafonnée par l'app ; le reste l'est à 2 000)
    function endGame(success, score, bonus) {
      sendToReactNative({ type: 'GAME_OVER', success, score, bonus: bonus || 0 });
    }
    function notifyReady() {
      sendToReactNative({ type: 'GAME_READY' });
    }

    let currentDifficulty = 'easy';
    let arcadeMode = false; // onglet Jeux : partie sans fin (ou par niveaux), sans objectif du jour
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'INIT') {
          arcadeMode = data.arcade === true;
          currentDifficulty = data.difficulty;
          configureDifficulty(currentDifficulty);
        }
      } catch (e) {}
    });

    // ============================================
    // CONFIG SPÉCIFIQUE STACK
    // ============================================

    const DIFFICULTY_SETTINGS = {
      // perfectTolerance : décalage (px) encore compté comme "parfait" (bloc non réduit)
      // Retour testeur « trop simple » : blocs plus rapides et marge « parfait » plus petite
      easy:      { speed: 145, targetFloors: 15, perfectTolerance: 5 },
      medium:    { speed: 195, targetFloors: 16, perfectTolerance: 3 },
      hard:      { speed: 235, targetFloors: 18, perfectTolerance: 2 },
      very_hard: { speed: 270, targetFloors: 20, perfectTolerance: 2 },
    };

    let settings = DIFFICULTY_SETTINGS.easy;

    // Objectif atteint : on peut continuer d'empiler, 25 blocs bonus au plus. Chaque bloc bonus rapporte 50 points
    // de plus et le bloc suivant va 8 % plus vite (jusqu'à 3,5× la vitesse de départ).
    const BONUS_MAX_FLOORS = 25;
    const POINTS_PER_FLOOR = 100;
    const BONUS_POINTS_PER_FLOOR = 50;
    const BONUS_SPEEDUP_PER_FLOOR = 0.08;
    const MAX_SPEED_FACTOR = 3.5;
    // Précision : en fin de partie, jusqu'à 500 points selon la largeur qu'il reste au dernier bloc posé
    // (100 % = aucun décalage de toute la partie). Plus on empile proprement, plus ça rapporte.
    const WIDTH_BONUS_MAX = 500;

    function configureDifficulty(difficulty) {
      settings = DIFFICULTY_SETTINGS[difficulty] || DIFFICULTY_SETTINGS.easy;
      startGame();
    }

    // INIT peut être reçu à chaque "Rejouer" : on repart toujours d'une partie propre
    function startGame() {
      blocks.forEach((block) => block.sprite && block.sprite.destroy());
      if (currentBlock) currentBlock.sprite.destroy();
      blocks = [];
      currentBlock = null;
      movingDirection = 1;
      floorsBuilt = 0;
      cameraOffsetY = 0;
      scene.cameras.main.scrollY = 0;
      gameEnded = false;
      if (stopButton) { stopButton.destroy(); stopButton = null; }

      // La taille finale de la WebView n'est connue qu'ici, pas dans create
      const baseLeft = Math.round((scene.scale.width - INITIAL_BLOCK_WIDTH) / 2);
      const baseY = Math.round(scene.scale.height - 100);
      progressText.setX(scene.scale.width / 2);
      updateProgressText();

      const baseSprite = drawBlock(baseLeft, baseY, INITIAL_BLOCK_WIDTH, COLORS[0]);
      blocks.push({ left: baseLeft, width: INITIAL_BLOCK_WIDTH, y: baseY, sprite: baseSprite });
      spawnNextBlock();
    }

    const BLOCK_HEIGHT = 40;
    const INITIAL_BLOCK_WIDTH = 200;
    const COLORS = [0x7c3aed, 0xa78bfa, 0x6ee7b7, 0x34d399, 0xf5c842, 0xfb923c];

    let scene;
    // Tout est en pixels entiers (bord gauche + largeur) : la coupe tombe pile sur le bord du bloc du dessous
    let blocks = [];          // historique des blocs empilés {left, width, y}
    let currentBlock = null;  // bloc en mouvement : {pos (bord gauche, décimal pendant le mouvement), width, y}
    let movingDirection = 1;
    let floorsBuilt = 0;
    let cameraOffsetY = 0;
    let gameEnded = false;
    let progressText = null;
    let stopButton = null;

    function preload() {}

    function create() {
      scene = this;
      this.cameras.main.setBackgroundColor('rgba(0,0,0,0)');
      this.cameras.main.setRoundPixels(true);

      progressText = this.add.text(this.scale.width / 2, 24, '', {
        fontSize: '15px',
        align: 'center',
        fontFamily: 'monospace',
        color: '#ffffff',
        alpha: 0.75,
      }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(10);
      updateProgressText();

      this.input.on('pointerdown', (pointer) => {
        // Bouton « Terminer » du bonus : on garde le score sans lâcher de bloc
        if (stopButton && stopButton.getBounds().contains(pointer.x, pointer.y)) {
          finishGame(true);
          return;
        }
        handleTap();
      });
      // Sur ordi : Espace, Entrée ou ↓ pour lâcher le bloc
      ['SPACE', 'ENTER', 'DOWN'].forEach((key) => this.input.keyboard.on('keydown-' + key, (event) => { if (!event.repeat) handleTap(); }));

      notifyReady();
    }

    function update(time, delta) {
      if (gameEnded || !currentBlock) return;

      // Vitesse en px/s, indépendante du nombre d'images par seconde
      currentBlock.pos += movingDirection * currentSpeed() * Math.min(delta, 50) / 1000;

      const minLeft = EDGE_MARGIN;
      const maxLeft = scene.scale.width - EDGE_MARGIN - currentBlock.width;
      // Demi-tour seulement si on va VERS le bord (sinon, après un redimensionnement,
      // un bloc déjà hors limite changerait de sens à chaque image et resterait coincé)
      if ((currentBlock.pos > maxLeft && movingDirection > 0) || (currentBlock.pos < minLeft && movingDirection < 0)) {
        movingDirection *= -1;
      }

      // Affiché sur un pixel entier : pas de bords flous pendant le mouvement
      currentBlock.sprite.x = Math.round(currentBlock.pos);
    }

    // Onglet Jeux : pas d'objectif, on empile sans fin (chaque bloc compte comme un bloc bonus)
    function targetFloors() {
      return arcadeMode ? 0 : settings.targetFloors;
    }

    function bonusFloors() {
      return Math.max(0, floorsBuilt - targetFloors());
    }

    function currentSpeed() {
      // Sans fin : +4 % par bloc, jusqu'à 3× la vitesse de départ
      if (arcadeMode) return settings.speed * Math.min(3, 1 + 0.04 * floorsBuilt);
      return settings.speed * Math.min(MAX_SPEED_FACTOR, 1 + BONUS_SPEEDUP_PER_FLOOR * bonusFloors());
    }

    // Part de la largeur de départ qu'il reste au dernier bloc posé (1 = rien n'a été coupé)
    function widthRatio() {
      const last = blocks[blocks.length - 1];
      return last ? last.width / INITIAL_BLOCK_WIDTH : 1;
    }

    function widthBonus() {
      return floorsBuilt > 0 ? Math.round(WIDTH_BONUS_MAX * widthRatio()) : 0;
    }

    function currentScore() {
      return floorsBuilt * POINTS_PER_FLOOR + bonusFloors() * BONUS_POINTS_PER_FLOOR + widthBonus();
    }

    function updateProgressText() {
      if (!progressText) return;
      const width = Math.round(widthRatio() * 100);
      if (arcadeMode) {
        progressText.setText(T(
          `${floorsBuilt} bloc${floorsBuilt > 1 ? 's' : ''} · largeur ${width} %\n${currentScore()} pts`,
          `${floorsBuilt} block${floorsBuilt === 1 ? '' : 's'} · width ${width}%\n${currentScore()} pts`
        )).setColor('#ffffff');
        return;
      }
      if (floorsBuilt >= targetFloors()) {
        progressText.setText(T(
          `Bonus +${bonusFloors()} / ${BONUS_MAX_FLOORS} · largeur ${width} %\n${currentScore()} pts`,
          `Bonus +${bonusFloors()} / ${BONUS_MAX_FLOORS} · width ${width}%\n${currentScore()} pts`
        )).setColor('#fbbf24');
        return;
      }
      const remaining = targetFloors() - floorsBuilt;
      progressText.setText(T(
        `${remaining} bloc${remaining > 1 ? 's' : ''} restant${remaining > 1 ? 's' : ''} · largeur ${width} %`,
        `${remaining} block${remaining === 1 ? '' : 's'} left · width ${width}%`
      )).setColor('#ffffff');
    }

    // Objectif atteint : fragment gagné, on peut continuer pour des points bonus
    function startBonus() {
      sfx('perfect');
      const width = scene.scale.width;
      const banner = scene.add.text(width / 2, 120, T('🎉 Objectif atteint !\nContinue pour des points bonus\n(ça va accélérer !)', '🎉 Goal reached!\nKeep going for bonus points\n(it’ll speed up!)'), {
        fontSize: '17px', color: '#fbbf24', fontStyle: 'bold', align: 'center', stroke: '#0c1521', strokeThickness: 5,
        wordWrap: { width: width - 24 },
      }).setOrigin(0.5).setScrollFactor(0).setDepth(20);
      scene.tweens.add({ targets: banner, alpha: 0, delay: 2200, duration: 700, onComplete: () => banner.destroy() });
      // Sous le texte de progression (qui passe sur deux lignes en bonus)
      stopButton = scene.add.text(width - 16, 72, T('✓ Terminer', '✓ Finish'), {
        fontSize: '15px', color: '#ffffff', fontStyle: 'bold', backgroundColor: '#7c3aed', padding: { x: 10, y: 6 },
      }).setOrigin(1, 0).setScrollFactor(0).setDepth(20);
    }

    const EDGE_MARGIN = 10;

    // Bloc dessiné depuis son bord gauche (x = left, entier). Le liseré clair est tracé à l'intérieur du bloc
    // pour ne jamais déborder sur le voisin (sinon les bords coupés paraissent décalés d'un pixel)
    function drawBlock(left, y, width, color) {
      const block = scene.add.container(left, y);
      const fill = scene.add.rectangle(0, 0, width, BLOCK_HEIGHT, color).setOrigin(0, 0.5);
      const outline = scene.add.graphics();
      outline.lineStyle(2, 0xffffff, 0.18);
      outline.strokeRect(1, -BLOCK_HEIGHT / 2 + 1, width - 2, BLOCK_HEIGHT - 2);
      block.add([fill, outline]);
      return block;
    }

    function spawnNextBlock() {
      const lastBlock = blocks[blocks.length - 1];
      const newY = lastBlock.y - BLOCK_HEIGHT;
      const colorIndex = floorsBuilt % COLORS.length;

      const startLeft = movingDirection > 0 ? EDGE_MARGIN : scene.scale.width - EDGE_MARGIN - lastBlock.width;
      const sprite = drawBlock(Math.round(startLeft), newY, lastBlock.width, COLORS[colorIndex]);

      currentBlock = { pos: startLeft, width: lastBlock.width, y: newY, sprite };

      // Décale la caméra vers le haut si on approche du sommet de l'écran visible
      if (newY < 150) {
        cameraOffsetY += BLOCK_HEIGHT;
        scene.cameras.main.scrollY = -cameraOffsetY;
      }
    }

    function handleTap() {
      if (gameEnded || !currentBlock) return;

      const lastBlock = blocks[blocks.length - 1];
      // Position lâchée arrondie au pixel : tout le calcul qui suit est en entiers
      const droppedLeft = Math.round(currentBlock.pos);
      const diff = droppedLeft - lastBlock.left;

      // Alignement "parfait" si le décalage est sous la tolérance : le bloc se cale exactement sur celui du dessous
      const isPerfect = Math.abs(diff) <= settings.perfectTolerance;
      const newLeft = isPerfect ? lastBlock.left : Math.max(droppedLeft, lastBlock.left);
      const newRight = isPerfect ? lastBlock.left + lastBlock.width : Math.min(droppedLeft + currentBlock.width, lastBlock.left + lastBlock.width);
      const newWidth = newRight - newLeft;

      if (newWidth <= 0) {
        // Aucun chevauchement : fin de partie (gagnée si l'objectif était déjà atteint)
        sfx('hurt');
        finishGame(floorsBuilt >= targetFloors());
        return;
      }

      currentBlock.sprite.destroy();
      const colorIndex = floorsBuilt % COLORS.length;
      const finalSprite = drawBlock(newLeft, currentBlock.y, newWidth, COLORS[colorIndex]);
      if (!isPerfect) dropOverhang(droppedLeft, currentBlock.width, currentBlock.y, newLeft, newRight, COLORS[colorIndex]);

      blocks.push({ left: newLeft, width: newWidth, y: currentBlock.y, sprite: finalSprite });
      sfx(isPerfect ? 'perfect' : 'place');
      floorsBuilt += 1;
      updateProgressText();

      if (!arcadeMode && floorsBuilt >= targetFloors() + BONUS_MAX_FLOORS) {
        finishGame(true);
        return;
      }
      if (!arcadeMode && floorsBuilt === targetFloors()) startBonus();

      if (newWidth < 15) {
        // Trop étroit pour continuer : gagné seulement si l'objectif est atteint
        finishGame(floorsBuilt >= targetFloors());
        return;
      }

      spawnNextBlock();
    }

    // Le morceau qui dépasse est coupé et tombe : on voit clairement la réduction du bloc
    // Le morceau coupé part exactement du bord où le bloc a été tranché
    function dropOverhang(blockLeft, blockWidth, y, keptLeft, keptRight, color) {
      const blockRight = blockLeft + blockWidth;
      const pieces = [];
      if (blockLeft < keptLeft) pieces.push([blockLeft, keptLeft]);
      if (blockRight > keptRight) pieces.push([keptRight, blockRight]);
      pieces.forEach(([left, right]) => {
        const piece = scene.add.rectangle((left + right) / 2, y, right - left, BLOCK_HEIGHT, color);
        const direction = left < keptLeft ? -1 : 1;
        scene.tweens.add({
          targets: piece,
          y: y + 400,
          x: piece.x + direction * 60,
          angle: direction * 50,
          alpha: 0,
          duration: 800,
          ease: 'Quad.easeIn',
          onComplete: () => piece.destroy(),
        });
      });
    }

    function finishGame(success) {
      if (gameEnded) return;
      gameEnded = true;
      const score = currentScore();
      // petite pause visuelle avant de transmettre le résultat
      scene.time.delayedCall(400, () => {
        // Blocs au-delà de l'objectif = bonus (hors plafond) ; l'onglet Jeux n'est pas plafonné
        endGame(success && floorsBuilt > 0, score, arcadeMode ? 0 : bonusFloors() * (POINTS_PER_FLOOR + BONUS_POINTS_PER_FLOOR));
      });
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: 'rgba(0,0,0,0)',
      transparent: true,
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
      },
      scene: { preload, create, update },
    };

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
