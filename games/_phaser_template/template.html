<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #game-container { width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    // ============================================
    // PONT DE COMMUNICATION — ne pas modifier
    // ============================================
    function sendToReactNative(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      } else {
        console.log('[DEV MODE] Message envoyé:', message); // utile si tu testes le HTML seul dans un navigateur
      }
    }

    function endGame(success, score) {
      sendToReactNative({ type: 'GAME_OVER', success, score });
    }

    function notifyReady() {
      sendToReactNative({ type: 'GAME_READY' });
    }

    function notifyHintUsed() {
      sendToReactNative({ type: 'REQUEST_HINT_USE' });
    }

    let currentDifficulty = 'easy';

    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        if (data.type === 'INIT') {
          currentDifficulty = data.difficulty;
          // Le jeu spécifique doit lire `currentDifficulty` au démarrage
        }
      } catch (e) {
        console.warn('Message RN invalide:', event.data);
      }
    });

    // ============================================
    // CONFIG PHASER — personnaliser par jeu
    // ============================================
    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: window.innerWidth,
      height: window.innerHeight,
      backgroundColor: '#0c1521',
      scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
      },
      scene: {
        preload: preload,
        create: create,
        update: update,
      },
    };

    function preload() {
      // chargement des assets spécifiques au jeu
    }

    function create() {
      // initialisation du jeu
      notifyReady(); // ⚠️ toujours appeler ceci une fois le jeu prêt à être joué
    }

    function update() {
      // boucle de jeu
    }

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
